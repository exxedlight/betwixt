$font = KogniGear, Pixellari

general {
    hide_cursor = false
}

# uncomment to enable fingerprint authentication
# auth {
#     fingerprint {
#         enabled = true
#         ready_message = Scan fingerprint to unlock
#         present_message = Scanning...
#         retry_delay = 250 # in milliseconds
#     }
# }

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor = eDP-1
    path = screenshot
    blur_passes = 2
    blur_size = 2
}

input-field {
    monitor =
    size = 20%, 50
    outline_thickness = 3
    inner_color = rgba(0, 0, 0, 0.2) # no fill

    outer_color = rgba(132, 0, 255, 0.3) rgba(0, 200, 255, 0.5) 45deg
    capslock_color = rgba(132, 0, 255, 0.3) rgba(21, 255, 0, 0.5) 45deg
    check_color = rgba(0, 200, 255, 0.3) rgba(132, 0, 255, 0.6) 45deg
    fail_color = rgb(255, 0, 0) rgba(255, 0, 0, 0.4) 45deg

    font_color = rgba(255, 255, 255, 0.8)
    fade_on_empty = false
    rounding = 30

    font_family = $font
    placeholder_text = Session locked
    fail_text = Incorrent password #$PAMFAIL

    # uncomment to use a letter instead of a dot to indicate the typed password
    # dots_text_format = *
    # dots_size = 0.4
    dots_spacing = 0.3

    # uncomment to use an input indicator that does not show the password length (similar to swaylock's input indicator)
    # hide_input = true

    position = 0, -20
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = $TIME # ref. https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/#variable-substitution
    font_size = 120
    font_family = $font

    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(59, 25, 91, 0.4)


    position = -100, -150
    halign = center
    valign = top
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y" # update every 60 seconds
    font_size = 30
    font_family = $font

    shadow_passes = 2
    shadow_size = 5
    shadow_color = rgba(64, 0, 124, 0.3)

    position = 100, -320
    halign = center
    valign = top
}

# LANG
label {
    monitor =
    text = $LAYOUT[us,ru,ua]
    font_family = $font
    font_size = 18
    onclick = hyprctl switchxkblayout all next
    color = rgb(147, 188, 212)

    position = 165, -60
    halign = center
    valign = center
}